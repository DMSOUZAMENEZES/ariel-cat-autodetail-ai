[project]
name = "autodetail-backend"
version = "0.1.0"
description = "FastAPI backend for AutoDetail AI foundation."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.3",
  "asyncpg>=0.30.0",
  "fastapi>=0.115.6",
  "greenlet>=3.1.1",
  "pydantic-settings>=2.7.0",
  "python-dotenv>=1.0.1",
  "redis>=5.2.1",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.8.4"
]

[tool.ruff]
line-length = 100
target-version = "py312"
